name: 每日更新 Top 10 选股

on:
  schedule:
    # GitHub cron 使用 UTC；以下对应北京时间 09:25 / 15:05 / 17:35，周一至周五
    - cron: '25 1 * * 1-5'
    - cron: '5 7 * * 1-5'
    - cron: '35 9 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '选股模式'
        required: true
        default: 'post'
        type: choice
        options:
          - post
          - auction

permissions:
  contents: write

concurrency:
  group: daily-picks
  cancel-in-progress: false

jobs:
  update-picks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 确定选股模式
        id: mode
        env:
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ -n "$INPUT_MODE" ]; then
            MODE="$INPUT_MODE"
          else
            # 按实际运行时刻的北京时间动态判定，而非按 cron 触发字符串映射。
            # GitHub 高峰期 scheduled run 可能延迟数小时，按触发源映射会把 auction 模式跑在盘后。
            BJ_HM=$(date -u -d '+8 hours' +%H%M)
            if [ "$BJ_HM" -ge 0915 ] && [ "$BJ_HM" -le 0940 ]; then
              MODE="auction"
            else
              MODE="post"
            fi
            echo "运行时刻北京时间: $BJ_HM"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "本次模式: $MODE"

      - name: 运行选股脚本
        env:
          TZ: Asia/Shanghai
          PYTHONUNBUFFERED: '1'
        run: |
          python3 scripts/auto_pick_top10.py \
            --mode "${{ steps.mode.outputs.mode }}" \
            --out web/daily_picks.json

      - name: 校验结果
        id: validate
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import pathlib

          data = json.loads(pathlib.Path("web/daily_picks.json").read_text(encoding="utf-8"))
          picks = data.get("picks") or []
          zt_count = (data.get("marketSummary") or {}).get("ztCount", 0)
          valid = bool(data.get("ok")) and len(picks) >= 3 and zt_count >= 1
          print("valid=" + ("true" if valid else "false"))
          print("picks=" + str(len(picks)))
          print("tradeDate=" + str(data.get("tradeDate", "")))
          PY

      - name: 提交更新
        if: steps.validate.outputs.valid == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/daily_picks.json
          if git diff --cached --quiet; then
            echo "内容与仓库一致，无需提交"
            exit 0
          fi
          git commit -m "chore(data): 自动更新 Top 10 (${{ steps.mode.outputs.mode }} / ${{ steps.validate.outputs.tradeDate }})"
          git push

      - name: 结果无效时保留原文件
        if: steps.validate.outputs.valid != 'true'
        run: |
          echo "::warning::选股结果无效（picks=${{ steps.validate.outputs.picks }}），保留原 daily_picks.json，不提交。"
