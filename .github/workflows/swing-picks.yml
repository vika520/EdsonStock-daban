name: 波段选股 (Swing Picks)

on:
  schedule:
    # UTC 07:25 / 10:05 = 北京 15:25 / 18:05（比本地服务晚 5 分钟，兜底防本地挂掉）
    - cron: '25 7 * * 1-5'
    - cron: '5 10 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '选股模式'
        required: false
        default: 'post'
        type: choice
        options:
          - post

permissions:
  contents: write

concurrency:
  group: swing-picks
  cancel-in-progress: false

jobs:
  update-swing-picks:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 确定选股模式
        id: mode
        env:
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ -n "$INPUT_MODE" ]; then
            MODE="$INPUT_MODE"
          else
            # 波段只有 post 模式（15:20 初选 / 18:00 终选共用），无需按时间判定
            MODE="post"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "本次模式: $MODE"

      - name: 运行波段选股脚本
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 scripts/auto_pick_swing.py --mode "${{ steps.mode.outputs.mode }}" --out web/swing_picks.json

      - name: 校验结果
        id: validate
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import pathlib

          p = pathlib.Path("web/swing_picks.json")
          if not p.exists():
              print("valid=false")
              print("reason=文件不存在")
          else:
              data = json.loads(p.read_text(encoding="utf-8"))
              # 波段契约：ok 必须 true 且 regime 有效；防守期 picks 允许为空
              regime = data.get("regime") or {}
              valid = bool(data.get("ok")) and bool(regime.get("phase")) and isinstance(data.get("sectorRotation"), list)
              print("valid=" + ("true" if valid else "false"))
              print("phase=" + str(regime.get("phase", "")))
              print("picks=" + str(len(data.get("picks") or [])))
          PY

      - name: 提交更新
        if: steps.validate.outputs.valid == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/swing_picks.json web/swing_tracker.json
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore(data): 自动更新波段选股 (${{ steps.validate.outputs.phase }} / $(date -u -d '+8 hours' +%Y%m%d))"
            git push
          fi

      - name: 结果无效时保留原文件
        if: steps.validate.outputs.valid != 'true'
        run: |
          echo "::warning::波段选股结果无效（${{ steps.validate.outputs.reason || '校验未通过' }}），已保留原文件"
          git checkout -- web/swing_picks.json web/swing_tracker.json 2>/dev/null || true
